<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HJMflix (by Hj Maikel)</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black text-white font-sans min-h-screen flex flex-col">

  <!-- Header / Navbar -->
  <header class="sticky top-0 z-40 bg-black/90 backdrop-blur-md border-b border-gray-800">
    <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col sm:flex-row items-center justify-between gap-4">
      <div class="flex items-center gap-2">
        <h1 class="text-2xl font-black tracking-wider text-red-600 cursor-pointer" onclick="loadHomepage()">HJMflix</h1>
        <span class="text-[10px] bg-gray-800 text-gray-400 px-2 py-0.5 rounded-full border border-gray-700">by Hj Maikel</span>
      </div>

      <!-- Petak Carian -->
      <div class="relative w-full sm:w-80">
        <input type="text" id="searchInput" placeholder="Cari filem atau siri TV..." 
               class="w-full bg-gray-900 border border-gray-800 rounded-full px-4 py-2 text-sm text-white focus:outline-none focus:border-red-600 transition">
        <button onclick="searchMedia()" class="absolute right-3 top-2.5 text-gray-400 hover:text-white">🔍</button>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="max-w-7xl mx-auto px-4 py-8 flex-1 w-full space-y-10">
    
    <!-- Container untuk Hasil Carian (Tersembunyi secara lalai) -->
    <section id="searchResultsSection" class="hidden">
      <h2 id="searchTitle" class="text-xl font-bold mb-4 text-red-500">Hasil Carian</h2>
      <div id="searchGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4"></div>
    </section>

    <!-- Container Utama 4 Seksyen Homepage -->
    <div id="homepageSections" class="space-y-10">
      
      <!-- 1. Popular Movies -->
      <section>
        <div class="flex justify-between items-center mb-4 border-b border-gray-800 pb-2">
          <h2 class="text-lg font-bold text-gray-100 flex items-center gap-2">🔥 Popular Movies</h2>
        </div>
        <div id="popularMoviesGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4">
          <p class="col-span-full text-gray-500 text-sm">Memuatkan...</p>
        </div>
      </section>

      <!-- 2. Top Rated Movies -->
      <section>
        <div class="flex justify-between items-center mb-4 border-b border-gray-800 pb-2">
          <h2 class="text-lg font-bold text-gray-100 flex items-center gap-2">⭐ Top Rated Movies</h2>
        </div>
        <div id="topRatedMoviesGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4">
          <p class="col-span-full text-gray-500 text-sm">Memuatkan...</p>
        </div>
      </section>

      <!-- 3. Popular TV Series -->
      <section>
        <div class="flex justify-between items-center mb-4 border-b border-gray-800 pb-2">
          <h2 class="text-lg font-bold text-gray-100 flex items-center gap-2">📺 Popular TV Series</h2>
        </div>
        <div id="popularTvGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4">
          <p class="col-span-full text-gray-500 text-sm">Memuatkan...</p>
        </div>
      </section>

      <!-- 4. Top Rated TV Series -->
      <section>
        <div class="flex justify-between items-center mb-4 border-b border-gray-800 pb-2">
          <h2 class="text-lg font-bold text-gray-100 flex items-center gap-2">🏆 Top Rated TV Series</h2>
        </div>
        <div id="topRatedTvGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4">
          <p class="col-span-full text-gray-500 text-sm">Memuatkan...</p>
        </div>
      </section>

    </div>
  </main>

  <!-- Modal Video Player -->
  <div id="playerModal" class="fixed inset-0 z-50 bg-black/95 backdrop-blur-sm hidden flex flex-col items-center justify-center p-4">
    <div class="w-full max-w-4xl flex justify-between items-center mb-2">
      <span id="playerMediaTitle" class="text-sm font-bold text-gray-300 truncate max-w-md">Pemutar Video</span>
      <button onclick="closePlayer()" class="text-gray-400 hover:text-white text-sm font-bold bg-gray-900 px-3 py-1 rounded-lg border border-gray-800">✕ Tutup</button>
    </div>

    <!-- Container Player -->
    <div class="w-full max-w-4xl aspect-video bg-gray-900 rounded-xl overflow-hidden shadow-2xl border border-gray-800">
      <iframe id="videoPlayer" class="w-full h-full" frameborder="0" allowfullscreen allow="autoplay; encrypted-media; picture-in-picture"></iframe>
    </div>

    <!-- Kawalan Episode (Hanya muncul jika TV Series) -->
    <div id="tvControls" class="w-full max-w-4xl mt-3 hidden flex items-center gap-3 bg-gray-900 p-2.5 rounded-lg border border-gray-800">
      <label class="text-xs text-gray-400 font-semibold">Season:</label>
      <input type="number" id="seasonInput" value="1" min="1" class="w-16 bg-black border border-gray-700 rounded px-2 py-1 text-xs text-center">
      
      <label class="text-xs text-gray-400 font-semibold">Episode:</label>
      <input type="number" id="episodeInput" value="1" min="1" class="w-16 bg-black border border-gray-700 rounded px-2 py-1 text-xs text-center">
      
      <button onclick="updateTvStream()" class="bg-red-600 hover:bg-red-700 text-xs px-3 py-1 rounded font-bold transition">Tukar Episode</button>
    </div>

    <!-- Kawalan Server -->
    <div class="w-full max-w-4xl mt-4">
      <div class="flex flex-wrap items-center gap-2">
        <span class="text-xs font-semibold text-gray-400 mr-2">Pilih Server:</span>
        <button id="btn-vidlink" onclick="changeProvider('vidlink')" class="server-btn bg-red-600 px-3 py-1.5 rounded-lg text-xs font-bold transition">Server 1 (VidLink)</button>
        <button id="btn-vidfast" onclick="changeProvider('vidfast')" class="server-btn bg-gray-800 hover:bg-gray-700 px-3 py-1.5 rounded-lg text-xs font-bold transition">Server 2 (VidFast)</button>
        <button id="btn-vidsrc" onclick="changeProvider('vidsrc')" class="server-btn bg-gray-800 hover:bg-gray-700 px-3 py-1.5 rounded-lg text-xs font-bold transition">Server 3 (VidSrc)</button>
      </div>
    </div>
  </div>

  <footer class="bg-gray-950 border-t border-gray-900 py-6 text-center text-xs text-gray-600">
    <p>© HJMflix — Built with TMDB API & Vercel</p>
  </footer>

  <script>
    let currentTmdbId = null;
    let currentMediaType = 'movie'; // 'movie' atau 'tv'

    // Muat Turun Semua 4 Seksyen
    async function loadHomepage() {
      document.getElementById('searchResultsSection').classList.add('hidden');
      document.getElementById('homepageSections').classList.remove('hidden');
      document.getElementById('searchInput').value = '';

      fetchSection('popular_movies', 'popularMoviesGrid', 'movie');
      fetchSection('top_rated_movies', 'topRatedMoviesGrid', 'movie');
      fetchSection('popular_tv', 'popularTvGrid', 'tv');
      fetchSection('top_rated_tv', 'topRatedTvGrid', 'tv');
    }

    async function fetchSection(category, gridId, mediaType) {
      const grid = document.getElementById(gridId);
      try {
        const res = await fetch(`/api/movies?category=${category}`);
        const data = await res.json();
        if (data.results) {
          // Hadkan 10 item per seksyen supaya homepage kemas
          displayGrid(data.results.slice(0, 10), grid, mediaType);
        }
      } catch (err) {
        grid.innerHTML = `<p class="col-span-full text-red-500 text-xs">Gagal memuatkan data.</p>`;
      }
    }

    function displayGrid(items, gridElement, mediaType) {
      if (!items || items.length === 0) {
        gridElement.innerHTML = `<p class="col-span-full text-gray-500 text-xs py-4">Tiada kandungan.</p>`;
        return;
      }

      gridElement.innerHTML = items.map(m => {
        const title = m.title || m.name;
        const date = m.release_date || m.first_air_date || '';
        const year = date ? date.split('-')[0] : 'N/A';
        const typeLabel = mediaType === 'tv' ? 'TV' : 'Movie';

        return `
          <div onclick="playMedia(${m.id}, '${mediaType}', '${title.replace(/'/g, "\\'")}')" 
               class="group cursor-pointer bg-gray-900 rounded-lg overflow-hidden border border-gray-800 hover:border-red-600/50 hover:scale-105 transition duration-300 shadow-md">
            <div class="relative">
              <img src="${m.poster_path ? 'https://image.tmdb.org/t/p/w500' + m.poster_path : 'https://via.placeholder.com/500x750?text=No+Poster'}" 
                   alt="${title}" class="w-full h-auto object-cover" loading="lazy">
              <span class="absolute top-2 right-2 bg-black/80 text-white text-[9px] px-1.5 py-0.5 rounded border border-gray-700 font-bold uppercase">${typeLabel}</span>
            </div>
            <div class="p-2.5">
              <p class="text-xs font-semibold truncate group-hover:text-red-500 transition">${title}</p>
              <p class="text-[10px] text-gray-400 mt-0.5">${year}</p>
            </div>
          </div>
        `;
      }).join('');
    }

    // Fungsi Carian Multi
    async function searchMedia() {
      const query = document.getElementById('searchInput').value.trim();
      if (!query) return loadHomepage();

      document.getElementById('homepageSections').classList.add('hidden');
      const searchSection = document.getElementById('searchResultsSection');
      const searchGrid = document.getElementById('searchGrid');
      
      searchSection.classList.remove('hidden');
      document.getElementById('searchTitle').innerText = `Hasil Carian: "${query}"`;
      searchGrid.innerHTML = '<p class="col-span-full text-gray-500 text-sm py-8">Mencari...</p>';

      try {
        const res = await fetch(`/api/movies?type=search&query=${encodeURIComponent(query)}`);
        const data = await res.json();
        const filtered = (data.results || []).filter(item => item.media_type === 'movie' || item.media_type === 'tv');
        
        displayGrid(filtered, searchGrid, 'multi');
      } catch (err) {
        searchGrid.innerHTML = '<p class="col-span-full text-red-500 text-sm">Gagal carian.</p>';
      }
    }

    // Buka Modal Player
    function playMedia(id, type, title) {
      currentTmdbId = id;
      currentMediaType = type;
      
      document.getElementById('playerMediaTitle').innerText = title;
      document.getElementById('playerModal').classList.remove('hidden');
      document.body.style.overflow = 'hidden';

      const tvControls = document.getElementById('tvControls');
      if (type === 'tv') {
        tvControls.classList.remove('hidden');
        document.getElementById('seasonInput').value = 1;
        document.getElementById('episodeInput').value = 1;
      } else {
        tvControls.classList.add('hidden');
      }

      changeProvider('vidlink');
    }

    function updateTvStream() {
      changeProvider(document.querySelector('.server-btn.bg-red-600').id.replace('btn-', ''));
    }

    // Tukar Provider Player
    function changeProvider(provider) {
      const iframe = document.getElementById('videoPlayer');
      const season = document.getElementById('seasonInput').value || 1;
      const episode = document.getElementById('episodeInput').value || 1;

      if (currentMediaType === 'tv') {
        if (provider === 'vidlink') iframe.src = `https://vidlink.pro/tv/${currentTmdbId}/${season}/${episode}`;
        else if (provider === 'vidfast') iframe.src = `https://vidfast.vc/tv/${currentTmdbId}/${season}/${episode}`;
        else if (provider === 'vidsrc') iframe.src = `https://vidsrcme.ru/embed/tv/${currentTmdbId}/${season}/${episode}`;
      } else {
        if (provider === 'vidlink') iframe.src = `https://vidlink.pro/movie/${currentTmdbId}`;
        else if (provider === 'vidfast') iframe.src = `https://vidfast.vc/movie/${currentTmdbId}`;
        else if (provider === 'vidsrc') iframe.src = `https://vidsrcme.ru/embed/movie/${currentTmdbId}`;
      }

      // Highlight Butang Server
      document.querySelectorAll('.server-btn').forEach(btn => {
        btn.classList.remove('bg-red-600');
        btn.classList.add('bg-gray-800', 'hover:bg-gray-700');
      });
      const activeBtn = document.getElementById(`btn-${provider}`);
      if (activeBtn) {
        activeBtn.classList.remove('bg-gray-800', 'hover:bg-gray-700');
        activeBtn.classList.add('bg-red-600');
      }
    }

    function closePlayer() {
      document.getElementById('playerModal').classList.add('hidden');
      document.getElementById('videoPlayer').src = '';
      document.body.style.overflow = 'auto';
    }

    document.getElementById('searchInput').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') searchMedia();
    });

    loadHomepage();
  </script>
</body>
</html>
